
services:
  # El entorno de ejecución de PHP 8.3 para Laravel 13
  app:
    image: php:8.3-fpm
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./laravel:/var/www/html
    environment:
      - DB_HOST=db
    networks:
      - laravel_network
    depends_on:
      - db
    # Instalamos las extensiones necesarias para que Laravel y Postgres interactúen sin problemas
    entrypoint: >
      sh -c "apt-get update && apt-get install -y libpq-dev unzip git
      && docker-php-ext-install pdo pdo_pgsql pdo_mysql
      && curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
      && php-fpm"

  # Servidor Web Nginx
  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./laravel:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel_network
    depends_on:
      - app

  # Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: laravel_db
    restart: unless-stopped
    tty: true
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - laravel_network

networks:
  laravel_network:
    driver: bridge

volumes:
  pgdata:
    driver: local