services:
  nextjs-app:
    # Actualizado a la versión LTS 
    image: node:22-alpine
    container_name: nextjs_dev
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./nextjs:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run dev"
    stdin_open: true
    tty: true
