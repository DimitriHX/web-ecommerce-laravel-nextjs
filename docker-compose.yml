services:
  # -------------------------------------------------------------
  # Backend: PHP 8.3-FPM (Laravel)
  # -------------------------------------------------------------
  app:
    image: php:8.3-fpm
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./laravel:/var/www/html
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-laravel}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-local_password}
    networks:
      - ecommerce_network
    depends_on:
      - db
    # Extensiones necesarias para Laravel y PostgreSQL + Composer
    entrypoint: >
      sh -c "apt-get update && apt-get install -y libpq-dev unzip git
      && docker-php-ext-install pdo pdo_pgsql pdo_mysql
      && curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
      && php-fpm"

  # -------------------------------------------------------------
  # Servidor Web Nginx (para Laravel)
  # -------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./laravel:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ecommerce_network
    depends_on:
      - app

  # -------------------------------------------------------------
  # Base de Datos PostgreSQL
  # -------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: laravel_db
    restart: unless-stopped
    tty: true
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ecommerce_network

  # -------------------------------------------------------------
  # Frontend: Next.js (Node.js 22 LTS)
  # -------------------------------------------------------------
  nextjs:
    image: node:22-alpine
    container_name: nextjs_dev
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./nextjs:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    command: sh -c "npm install && npm run dev"
    stdin_open: true
    tty: true
    networks:
      - ecommerce_network
    depends_on:
      - nginx

networks:
  ecommerce_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
